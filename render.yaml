services:
  - type: web
    name: ecoscan-backend-api
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: ./ecoscan-backend-v2
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ECOSCAN_DEMO_SEEDED_SQLITE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SQLITE_DB_PATH
        value: /tmp/ecoscan-demo.sqlite3
      - key: PROVISION_DEMO_ACCOUNTS
        value: "false"
      - key: PROVISION_DEMO_READER
        value: "false"
      - key: AI_SERVICE_URL
        value: https://ecoscan-ai-63na.onrender.com
      - key: AI_SERVICE_INTERNAL_TOKEN
        generateValue: true
      - key: DJANGO_INTERNAL_TOKEN
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://ecoscan-front-end-ecoscan-front-end.vercel.app
